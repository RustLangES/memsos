name: Release Build and Publish

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Name of release (optional)"
        required: false
        default: ""
      create_release:
        description: "Create a GitHub release? (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: "x86_64"
            rust_target: "x86_64-unknown-none"
            name: "x86_64" # x86_64
          - arch: "aarch64"
            rust_target: "aarch64-unknown-none"
            name: "aarch64" # aarch64
          - arch: "aarch64"
            rust_target: "aarch64-unknown-uefi"
            name: "aarch64-uefi" # UEFI aarch64
          - arch: "riscv64"
            rust_target: "riscv64imac-unknown-none-elf"
            name: "riscv64-imac" # IMAC RISC-V
          - arch: "riscv64"
            rust_target: "riscv64gc-unknown-none-elf"
            name: "riscv64-gc" # GC RISC-V
    env:
      RUST_PROFILE: "release"
      ARCH: "${{ matrix.arch }}"
      RUST_TARGET: "${{ matrix.rust_target }}"
      IMAGE_NAME: "memsos_${{ matrix.name }}-${{ github.event.inputs.release_name || github.ref_name }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: sudo apt-get install -y xorriso

      - name: Build for architecture
        run: |
          echo "Building for ${{ matrix.arch }} with target ${{ matrix.rust_target }}..."
          just build

          mkdir -p isos
          mv "${{ env.IMAGE_NAME }}.iso" "isos/"

      - name: Get release name
        id: release_name
        run: |
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Get commit history with mentions
        id: commit_history
        run: |
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            echo "COMMIT_HISTORY=$(git log --pretty=format:'- %s (by @%an)' -n 10)" >> $GITHUB_ENV
          else
            echo "COMMIT_HISTORY=$(git log --pretty=format:'- %s (by @%an)' $(git describe --tags --abbrev=0)..HEAD)" >> $GITHUB_ENV
          fi

      - name: Upload ISOs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isos
          path: isos/

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
    steps:
      - name: Download ISOs
        uses: actions/download-artifact@v4
        with:
          name: isos
          path: isos/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.RELEASE_NAME }}
          name: ${{ needs.build.outputs.RELEASE_NAME }}
          body: ${{ needs.build.outputs.COMMIT_HISTORY }}
          files: |
            isos/memsos_*.iso
