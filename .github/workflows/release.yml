name: Release Build and Publish

permissions:
  contents: write
  pull-requests: read

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Name of release (optional)"
        required: false
        default: ""
      create_release:
        description: "Create a GitHub release? (true/false)"
        required: false
        default: "false"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modified language files (PR only)
        if: github.event_name == 'pull_request'
        id: detect-modified-langs
        run: |
          git remote -v
          git fetch origin ${{ github.base_ref }}

          MODIFIED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E 'crates/lang/defs/.*\.UTF-8\.json$' || true)

          if [[ -z "$MODIFIED_FILES" ]]; then
            echo "No language files modified, defaulting to en_US"
            echo "langs=[\"en_US\"]" >> "$GITHUB_OUTPUT"
          else
            LANG_ARRAY=$(echo "$MODIFIED_FILES" | \
              sed -E 's|crates/lang/defs/(.*)\.UTF-8\.json|\1|g' | \
              awk 'BEGIN{printf "["} {if(NR>1)printf ","; printf "\"%s\"", $0} END{printf "]"}')

            echo "Modified languages array: $LANG_ARRAY"
            echo "langs=$LANG_ARRAY" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate matrix
        id: generate-matrix
        run: |
          ARCHITECTURES=("x86_64" "aarch64" "aarch64-uefi" "riscv64-imac" "riscv64-gc")

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LANGUAGES='${{ steps.detect-modified-langs.outputs.langs }}'
          else
            LANG_FILES=$(ls crates/lang/defs/*.UTF-8.json)
            LANGUAGES=$(echo "$LANG_FILES" | \
              sed -E 's|crates/lang/defs/(.*)\.UTF-8\.json|\1|g' | \
              awk 'BEGIN{printf "["} {if(NR>1)printf ","; printf "\"%s\"", $0} END{printf "]"}')
          fi

          MATRIX=$(jq -n '[]')
          for arch in "${ARCHITECTURES[@]}"; do
            for lang in $(echo "$LANGUAGES" | jq -r '.[]'); do
              MATRIX=$(echo "$MATRIX" | jq --arg arch "$arch" --arg lang "$lang" '. += [{"arch": $arch, "lang": $lang}]')
            done
          done

          echo "Generated Matrix:"
          echo "$MATRIX" | jq .
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      RUST_PROFILE: "release"
      ARCH: "${{ matrix.arch }}"
      LANG: "${{ matrix.lang }}"
      IMAGE_NAME: "memsos_${{ matrix.arch }}-${{ matrix.lang }}-${{ github.event.inputs.release_name || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name) }}"

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Normalize IMAGE_NAME
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '/ ' '_-' | tr -cd '[:alnum:]._-')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build with Nix
        run: |
          echo "Building for ${{ matrix.arch }} with language ${{ matrix.lang }}..."
          nix build .#${{ matrix.arch }}-${{ matrix.lang }}

          mkdir -p isos
          cp result/memsos-${{ matrix.arch }}-${{ matrix.lang }}.iso isos/${{ env.IMAGE_NAME }}.iso

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}-${{ matrix.lang }}
          path: isos/${{ env.IMAGE_NAME }}.iso

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.create_release == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Get release name
        id: release_name
        run: |
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download ISOs
        uses: actions/download-artifact@v4
        with:
          path: isos

      - name: Combine ISOs into a single folder
        run: |
          mkdir -p combined_isos
          find isos -type f -name "*.iso" -exec cp {} combined_isos/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          prerelease: ${{ steps.release_name.outputs.release_name != '' && contains(steps.release_name.outputs.release_name, 'a') }}
          tag_name: ${{ steps.release_name.outputs.release_name }}
          name: ${{ steps.release_name.outputs.release_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            combined_isos/*.iso
            CHANGES.md
