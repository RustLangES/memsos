name: Update ovmf hashes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 * * * *"

jobs:
  update-ovmf-hashes:
    name: Update omvf hashes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COMMITER_APP_ID }}
          private-key: ${{ secrets.COMMITER_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Check if update is needed
        id: check
        run: |
          .github/update.sh --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Nix Magic Cache
        if: steps.check.outputs.should_update == 'true'
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Update versions
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          .github/update.sh --ci

      - name: Commit changes
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "${{ steps.update.outputs.commit_message }}"
          file_pattern: "*"
