[workspace]
resolver = '2'
members = [ "memsos", "kernel" , "crates/commons", "crates/sync", "crates/march-c", "crates/fb", "crates/boot", "crates/modulo-n", "crates/arch"]

[workspace.dependencies]
commons.path = "./crates/commons"
sync.path = "./crates/sync"
march-c.path = "./crates/march-c"
fb.path = "./crates/fb"
boot.path = "./crates/boot"
modulo-n.path = "./crates/modulo-n"
arch.path = "./crates/arch"
limine = "0.5.0"


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
